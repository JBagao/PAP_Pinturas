h1,h2,h3{line-height:1.2;margin:0 0 .5em}h2{color:var(--g)}h1{color:#222}h1{font-size:clamp(2.2rem,5vw,3.6rem)}h2{font-size:clamp(1.7rem,3vw,2.4rem)}
a{color:inherit}.w{max-width:1120px;margin:auto;padding:0 20px}.sec{padding:70px 0}.mut{color:var(--mut)}
header{position:sticky;top:0;z-index:50;background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav{display:flex;align-items:center;gap:20px;height:78px}.brand{display:flex;align-items:center;gap:10px;font-family:Arial,sans-serif;font-weight:700;text-decoration:none;margin-right:auto}.brand img{width:60px;height:60px;border-radius:0}
.nav a.l{color:#fff;text-decoration:none;font-size:.95rem;padding:6px 2px;border-bottom:2px solid transparent}.nav a.l:hover{color:#ffcc00}.nav a.on{border-color:#fff}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem}
.btn{display:inline-block;border:0;background:var(--g);color:#fff;font:600 .95rem Arial,sans-serif;padding:11px 22px;border-radius:6px;cursor:pointer;text-decoration:none;transition:.2s}.btn:hover{background:#b28a1f;transform:scale(1.04)}header .btn{background:#fff;color:var(--g)}header .btn:hover{background:#fff6dc}
.btn.o{background:transparent;border:1.5px solid var(--g);color:var(--gd)}.btn.o:hover{background:var(--g);color:#fff}.btn.s{padding:6px 14px;font-size:.82rem}.btn.d{background:var(--bad);color:#fff}
.hero{padding:90px 0 70px}.hero .w{display:block}.hc{background:rgba(255,255,255,.75);max-width:800px;margin:auto;text-align:center;border-radius:10px;box-shadow:5px 5px 15px rgba(0,0,0,.2);padding:40px 30px}.hc h1{font-size:clamp(1.8rem,4vw,2.6rem)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:rgba(255,255,255,.92);border:1px solid var(--ln);border-radius:10px;padding:24px;box-shadow:0 4px 10px rgba(0,0,0,.1)}.card .ic{font-size:2rem}
.ba{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;--p:50%;box-shadow:var(--sh);user-select:none;background:#000}.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .a{clip-path:inset(0 calc(100% - var(--p)) 0 0)}.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba i{position:absolute;top:0;bottom:0;left:var(--p);width:3px;background:#fff;pointer-events:none}.ba i:after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 2px 8px #0005}
.ba span{position:absolute;bottom:10px;padding:2px 10px;border-radius:99px;background:#000a;color:#fff;font-size:.75rem}.ba .s1{left:10px}.ba .s2{right:10px}
.ba+h3{margin:14px 0 2px;font-size:1.15rem}
.page{padding:50px 0 80px;min-height:70vh}.page>h1{text-align:center}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:start}
form.f{display:grid;gap:14px}label{font-weight:500;font-size:.88rem;display:grid;gap:5px}
input,select,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink);width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
input[type=color]{padding:3px;height:44px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
.sum{position:sticky;top:86px}.sum .tot{font:700 2.2rem Arial,sans-serif;color:var(--gd)}.sum table{width:100%;font-size:.9rem}.sum td:last-child{text-align:right}
.sw{display:flex;gap:7px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--ln);cursor:pointer}
.auth{max-width:420px;margin:auto}.demo{background:#fff8e1;border:1px dashed var(--g);border-radius:12px;padding:12px;font-size:.85rem;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1.5px solid var(--ln);background:#fff;padding:8px 18px;border-radius:6px;cursor:pointer;font:500 .9rem Arial}.tabs .on{background:var(--g);color:#fff;border-color:var(--g)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.kpi .card{padding:16px}.kpi b{display:block;font:700 1.7rem Arial,sans-serif}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--ln);border-radius:var(--r)}table.t{border-collapse:collapse;width:100%;font-size:.86rem}.t th,.t td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}.t th{background:#f3ecd7;font-weight:600}
.pill{padding:2px 10px;border-radius:99px;font-size:.75rem;background:#eee}.p-Pendente{background:#fff0c2}.p-Aprovado{background:#cfeedd}.p-Concluído{background:#d7e6fb}.p-Recusado{background:#f8d4cf}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;margin-top:10px}.bars div{flex:1;text-align:center;font-size:.72rem}.bars i{display:block;background:linear-gradient(var(--g),#e9cf75);border-radius:6px 6px 0 0;min-height:3px}
.scene{perspective:1200px;height:430px;border-radius:var(--r);background:#fff;overflow:hidden;cursor:grab;touch-action:none;position:relative}.scene:active{cursor:grabbing}
.room{position:absolute;left:50%;top:50%;transform-style:preserve-3d}.face{position:absolute;left:50%;top:50%;background:#fff;border:1px solid #0002;backface-visibility:hidden}.face:after{content:"";position:absolute;inset:0;pointer-events:none}
.face.sel{outline:4px solid var(--g);outline-offset:-4px}.face.wl:after{background:linear-gradient(90deg,#0003,#0000 40%,#0002)}.face.ce:after{background:linear-gradient(#0000,#0003)}
.win{position:absolute;right:90px;top:70px;width:140px;height:130px;background:linear-gradient(#bfe3ff,#e8f5ff);border:8px solid #f5f5f5;box-shadow:inset 0 0 0 1px #0003}.door{position:absolute;left:60px;bottom:0;width:110px;height:230px;background:#a67c52;border:6px solid #8a6540}
.skirt{position:absolute;left:0;right:0;bottom:0;height:14px;background:#f2f2f2;border-top:1px solid #0002}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:8px;z-index:99;box-shadow:var(--sh)}
.dm{position:fixed;right:14px;bottom:14px;z-index:60;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 14px;font-size:.78rem;box-shadow:var(--sh);max-width:230px}.dm b{color:var(--gd)}
footer{position:relative;z-index:1;background:var(--g);color:#fff;text-align:center;padding:30px 0;font-size:.9rem}
.rev{opacity:0;transform:translateY(20px);transition:.7s}.rev.in{opacity:1;transform:none}

const PRECO={interior:[5,6],exterior:[6,7.2],ambos:[10,12]};

const KM={Lisboa:20,Porto:300,Coimbra:150,Setúbal:40,Faro:280,Outros:50};
const clara=c=>{const n=parseInt(c.slice(1),16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>215};
function calc(o){const base=PRECO[o.tipo][clara(o.cor)?0:1],f=DIST[o.distrito]||1,a=+o.area||0;
 const l=[['Pintura ('+o.tipo+')',a*base*f]];if(o.prep)l.push(['Preparação de superfícies',a*1.2*f]);if(o.premium)l.push(['Tinta premium lavável',a*.9*f]);
 return{linhas:l,total:l.reduce((s,x)=>s+x[1],0),base,f}}
const lucro=o=>o.valor-((KM[o.distrito]||50)*.5+o.area*2.5+30);

 <h2 style="margin-top:50px">Os meus pedidos</h2>${mine.length?`<div class="tw"><table class="t"><tr><th>Data</th><th>Tipo</th><th>Área</th><th>Valor</th><th>Estado</th></tr>${mine.map(o=>`<tr><td>${dt(o.data)}</td><td>${o.tipo}</td><td>${o.area} m²</td><td>${eur(o.valor)}</td><td><span class="pill p-${o.estado}">${o.estado}</span></td></tr>`).join('')}</table></div>`:'<p class="mut">Ainda não fez nenhum pedido.</p>'}</div>`}

 const pre=store.get('pg_pre');if(pre){f.cor.value=pre.cor;f.area.value=pre.area;f.tipo.value='interior';store.set('pg_pre',null)}

 <label>Piso<select id="ch">${[['madeira','Madeira cinza'],['claro','Flutuante claro'],['escuro','Flutuante escuro'],['marmore','Mármore'],['ceramica','Cerâmica']].map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
 <div class="row"><button class="btn o s" id="zi">Zoom +</button><button class="btn o s" id="zo">Zoom −</button></div><button class="btn o s" id="rs">Repor</button><p class="mut" id="ar" style="font-size:.85rem"></p><button class="btn" id="oq">Pedir orçamento com esta cor</button></div></div></div>`}
function bind_simulador(){const rm=$('#rm'),sc=$('#sc'),S=SIM;
 const draw=()=>{const f=(k,w,h,t,x='')=>`<div class="face ${k==='teto'?'ce':'wl'} ${S.sel===k?'sel':''}" data-k="${k}" style="width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px;background:${S.cores[k]};transform:${t}">${x}</div>`;
  rm.style.transform=`translateZ(${S.z}px) rotateX(${S.rx}deg) rotateY(${S.ry}deg)`;
  rm.innerHTML=f('frente',600,300,'translateZ(-250px)','<div class="skirt"></div>')+f('esquerda',500,300,'translateX(-300px) rotateY(90deg)','<div class="door"></div><div class="skirt"></div>')+f('direita',500,300,'translateX(300px) rotateY(-90deg)','<div class="win"></div><div class="skirt"></div>')+f('teto',600,500,'translateY(-150px) rotateX(-90deg)')+`<div class="face" style="width:600px;height:500px;margin:-250px 0 0 -300px;transform:translateY(150px) rotateX(90deg);background:#c9b99a url(${IMG['t_'+S.chao]}) 0 0/200px 200px"></div>`;
  $('#sc2').value=S.cores[S.sel];$('#ss').value=S.sel;$('#ch').value=S.chao;
  const pk=Object.keys(S.cores).filter(k=>S.cores[k]!=='#ffffff');$('#ar').textContent=pk.length?`Superfícies pintadas: ${pk.map(k=>FACES[k]).join(', ')} (${pk.reduce((s,k)=>s+AREA[k],0)} m²)`:'Escolha uma cor para começar.'};
 draw();let dr=null,moved=0;
 sc.onpointerdown=e=>{dr=[e.clientX,e.clientY,S.ry,S.rx];moved=0};
 addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr[0],dy=e.clientY-dr[1];moved=Math.abs(dx)+Math.abs(dy);S.ry=Math.max(-50,Math.min(50,dr[2]+dx*.3));S.rx=Math.max(-35,Math.min(10,dr[3]-dy*.3));rm.style.transform=`translateZ(${S.z}px) rotateX(${S.rx}deg) rotateY(${S.ry}deg)`});
 addEventListener('pointerup',()=>dr=null);
 sc.onclick=e=>{const f=e.target.closest('.face[data-k]');if(f&&moved<5){S.sel=f.dataset.k;draw()}};
 sc.onwheel=e=>{e.preventDefault();S.z=Math.max(-300,Math.min(350,S.z-e.deltaY*.3));draw()};
 $('#ss').onchange=e=>{S.sel=e.target.value;draw()};$('#sc2').oninput=e=>{S.cores[S.sel]=e.target.value;draw()};$('#ch').onchange=e=>{S.chao=e.target.value;draw()};
 $$('.sw button').forEach(b=>b.onclick=()=>{S.cores[S.sel]=b.dataset.c;draw()});
 $('#zi').onclick=()=>{S.z=Math.min(350,S.z+60);draw()};$('#zo').onclick=()=>{S.z=Math.max(-300,S.z-60);draw()};
 $('#rs').onclick=()=>{Object.assign(S,{cores:{frente:'#ffffff',esquerda:'#ffffff',direita:'#ffffff',teto:'#ffffff'},ry:-18,rx:-14,z:0});draw()};
 $('#oq').onclick=()=>{const pk=Object.keys(S.cores).filter(k=>S.cores[k]!=='#ffffff');store.set('pg_pre',{cor:S.cores[pk[0]||S.sel],area:pk.reduce((s,k)=>s+AREA[k],0)||40});go('#/orcamento')}}
